# Blueprint do Render: um banco Postgres e um serviço web (front + API + simulador) no plano gratuito.
databases:
  - name: urbanflow-db
    plan: free
    databaseName: urbanflow
    user: urbanflow
    postgresMajorVersion: "16"

services:
  - type: web
    name: urbanflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urbanflow-db
          property: connectionString
      - key: RUN_SIM
        value: "1"
