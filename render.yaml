# Blueprint do Render: um banco Postgres e um serviço web (front + API + simulador) no plano gratuito.
databases:
  - name: urbancare-db
    plan: free
    databaseName: urbancare
    user: urbancare
    postgresMajorVersion: "16"

services:
  - type: web
    name: urbancare
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urbancare-db
          property: connectionString
      - key: RUN_SIM
        value: "1"
